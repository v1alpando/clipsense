databaseChangeLog:
  - changeSet:
      id: 004-add-password-hash-to-users
      author: arman
      changes:
        - addColumn:
            schemaName: users
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: varchar(100)
                  # Placeholder for existing dev rows only - none of them can ever match a real
                  # bcrypt comparison, so those old test users just become permanently unable to
                  # log in (expected; this table only has throwaway local test data).
                  defaultValue: "unset"
                  constraints:
                    nullable: false
  - changeSet:
      id: 005-drop-password-hash-default
      author: arman
      changes:
        - dropDefaultValue:
            schemaName: users
            tableName: users
            columnName: password_hash
