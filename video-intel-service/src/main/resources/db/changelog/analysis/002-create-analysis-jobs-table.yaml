databaseChangeLog:
  - changeSet:
      id: 002-create-analysis-jobs-table
      author: arman
      changes:
        - createTable:
            schemaName: analysis
            tableName: analysis_jobs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: video_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: varchar(1000)
        - createIndex:
            schemaName: analysis
            tableName: analysis_jobs
            indexName: idx_analysis_jobs_video_id
            columns:
              - column:
                  name: video_id
