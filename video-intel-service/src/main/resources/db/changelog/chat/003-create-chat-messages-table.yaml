databaseChangeLog:
  - changeSet:
      id: 003-create-chat-messages-table
      author: arman
      changes:
        - createTable:
            schemaName: chat
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: chat
            tableName: chat_messages
            indexName: idx_chat_messages_session_id
            columns:
              - column:
                  name: session_id
