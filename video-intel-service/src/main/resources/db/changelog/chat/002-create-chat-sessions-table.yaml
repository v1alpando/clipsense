databaseChangeLog:
  - changeSet:
      id: 002-create-chat-sessions-table
      author: arman
      changes:
        - createTable:
            schemaName: chat
            tableName: chat_sessions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: video_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: owner_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: chat
            tableName: chat_sessions
            indexName: idx_chat_sessions_video_id
            columns:
              - column:
                  name: video_id
