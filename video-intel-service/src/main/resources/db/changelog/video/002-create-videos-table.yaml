databaseChangeLog:
  - changeSet:
      id: 002-create-videos-table
      author: arman
      changes:
        - createTable:
            schemaName: videos
            tableName: videos
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: storage_ref
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: videos
            tableName: videos
            indexName: idx_videos_owner_id
            columns:
              - column:
                  name: owner_id
